name: marketplace-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  VALLY_VERSION: "0.20.0"

jobs:
  structure:
    name: Structure, manifests and standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for the version-bump and duplicate checks

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate (pull request)
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate_repo.py --base origin/${{ github.base_ref }}

      - name: Validate (main)
        if: github.event_name == 'push'
        run: python3 scripts/validate_repo.py

  claude-validate:
    name: Claude plugin validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Anthropic's own validator for the generated Claude files. Pinned; bump deliberately.
      - name: claude plugin validate
        run: npx -y @anthropic-ai/claude-code@2.1.317 plugin validate .

  eval-lint:
    name: Eval lint (Vally, no model calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: vally lint
        run: npx -y @microsoft/vally-cli@${{ env.VALLY_VERSION }} lint plugins --eval-spec plugins --strict

  evals:
    name: Evals (changed plugins)
    runs-on: ubuntu-latest
    needs: [structure, eval-lint]
    if: github.event_name == 'pull_request'
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Find changed plugins
        id: changed
        run: |
          plugins=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- plugins/ \
            | cut -d/ -f2 | sort -u | while read -r p; do [ -f "plugins/$p/evals/eval.yaml" ] && echo "$p"; done | tr '\n' ' ')
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "Changed plugins with evals: ${plugins:-none}"
      - name: Run evals
        if: steps.changed.outputs.plugins != ''
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::warning::COPILOT_GITHUB_TOKEN secret is not set; evals were linted but not run."
            exit 0
          fi
          status=0
          for p in ${{ steps.changed.outputs.plugins }}; do
            echo "::group::evals: $p"
            npx -y @microsoft/vally-cli@${{ env.VALLY_VERSION }} eval \
              --eval-spec "plugins/$p/evals/eval.yaml" \
              --require-pass --junit --output-dir "vally-results/$p" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Upload eval results
        if: always() && steps.changed.outputs.plugins != ''
        uses: actions/upload-artifact@v4
        with:
          name: vally-results
          path: vally-results/
          if-no-files-found: ignore
