# Eval cases for bicep-avm-review.
# PLACEHOLDER FORMAT: this file shape will change when the evals design is finalised.
# The CI gate only counts cases for now (minimum 10 per plugin).
plugin: bicep-avm-review
cases:
  # Trigger: should fire
  - id: trigger-review-request
    type: trigger
    prompt: "Can you review main.bicep against AVM?"
    expect: { skill: bicep-avm-review, triggered: true }
  - id: trigger-production-ready
    type: trigger
    prompt: "Is this Bicep template production ready?"
    expect: { skill: bicep-avm-review, triggered: true }
  - id: trigger-audit-iac
    type: trigger
    prompt: "Audit the IaC in infra/ for security issues"
    expect: { skill: bicep-avm-review, triggered: true }
  - id: trigger-bicepparam
    type: trigger
    prompt: "Check prod.bicepparam for problems"
    expect: { skill: bicep-avm-review, triggered: true }
  # Trigger: should not fire
  - id: no-trigger-terraform
    type: trigger
    prompt: "Review my Terraform main.tf"
    expect: { skill: bicep-avm-review, triggered: false }
  - id: no-trigger-deploy
    type: trigger
    prompt: "Deploy main.bicep to the dev subscription"
    expect: { skill: bicep-avm-review, triggered: false }
  # Task: output quality
  - id: task-floating-version
    type: task
    fixture: fixtures/floating-version.bicep
    expect: { finding: AVM-02, severity: High }
  - id: task-raw-storage-resource
    type: task
    fixture: fixtures/raw-storage.bicep
    expect: { finding: AVM-01 }
  - id: task-literal-secret
    type: task
    fixture: fixtures/literal-secret.bicepparam
    expect: { finding: SEC-04, secret_value_printed: false }
  - id: task-no-bicep-files
    type: task
    fixture: fixtures/empty-folder
    expect: { stops: true, findings: 0 }
