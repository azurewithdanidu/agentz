# Vally evals for bicep-writer.
# Run:  npx -y @microsoft/vally-cli@0.20.0 eval --eval-spec plugins/bicep-writer/evals/eval.yaml --require-pass
name: bicep-writer
description: Checks that bicep-writer triggers on requests to author Bicep only, composes pinned AVM modules into the written files, keeps secrets out of templates, and stops when the request names no resources.
type: capability
defaults:
  executor: copilot-sdk
  runs: 3
  timeout: 3m
agent_environment:
  skills:
    - ../skills/bicep-writer
  files:
    - src: fixtures/existing-main.bicep
      dest: infra/main.bicep
scoring:
  threshold: 0.7
stimuli:
  # Should trigger
  - name: trigger-write-storage
    prompt: Write a Bicep template for a new storage account using AVM modules.
    tags: { kind: trigger, skill: bicep-writer }
    graders:
      - type: skill-invocation
        config: { required: [bicep-writer] }

  - name: trigger-create-keyvault
    prompt: Create Bicep for an Azure key vault with purge protection enabled.
    tags: { kind: trigger, skill: bicep-writer }
    graders:
      - type: skill-invocation
        config: { required: [bicep-writer] }

  - name: trigger-generate-vnet
    prompt: Generate Azure IaC in Bicep for a virtual network with two subnets.
    tags: { kind: trigger, skill: bicep-writer }
    graders:
      - type: skill-invocation
        config: { required: [bicep-writer] }

  - name: trigger-add-module
    prompt: Add a Log Analytics workspace to infra/main.bicep using an AVM module.
    tags: { kind: trigger, skill: bicep-writer }
    graders:
      - type: skill-invocation
        config: { required: [bicep-writer] }

  # Should not trigger
  - name: no-trigger-terraform
    prompt: Write Terraform for an Azure storage account with versioning enabled.
    tags: { kind: no-trigger, skill: bicep-writer }
    graders:
      - type: skill-invocation
        config: { disallowed: [bicep-writer] }

  - name: no-trigger-review
    prompt: Review infra/main.bicep against AVM and report any findings.
    tags: { kind: no-trigger, skill: bicep-writer }
    graders:
      - type: skill-invocation
        config: { disallowed: [bicep-writer] }

  - name: no-trigger-deploy
    prompt: Deploy infra/main.bicep to the dev subscription.
    tags: { kind: no-trigger, skill: bicep-writer }
    graders:
      - type: skill-invocation
        config: { disallowed: [bicep-writer] }

  # Task: real failure modes
  - name: task-pinned-module-version
    prompt: Write infra/storage.bicep for a storage account using the AVM storage account module, with the name taken from parameters. Treat this message as approval of your plan.
    tags: { kind: task, skill: bicep-writer, rule: WRT-02 }
    graders:
      - type: file-exists
        config: { path: infra/storage.bicep }
      - type: file-matches
        config: { path: infra/storage.bicep, pattern: 'br/public:avm/res/storage/storage-account:[0-9]+\.[0-9]+\.[0-9]+' }

  - name: task-extend-existing
    prompt: Add an Azure Key Vault to infra/main.bicep using an AVM module. Treat this message as approval of your plan.
    tags: { kind: task, skill: bicep-writer, rule: WRT-01 }
    graders:
      - type: file-matches
        config: { path: infra/main.bicep, pattern: 'br/public:avm/res/key-vault/vault:[0-9]+\.[0-9]+\.[0-9]+' }
      - type: file-matches
        config: { path: infra/main.bicep, pattern: 'br/public:avm/res/storage/storage-account:0\.14\.3' }

  - name: task-bicepparam-split
    prompt: Write infra/web.bicep for an App Service plan using AVM, with the environment-specific values in infra/dev.bicepparam. Treat this message as approval of your plan.
    tags: { kind: task, skill: bicep-writer, rule: WRT-05 }
    graders:
      - type: file-exists
        config: { path: infra/web.bicep }
      - type: file-exists
        config: { path: infra/dev.bicepparam }
      - type: file-matches
        config: { path: infra/dev.bicepparam, pattern: "using\\s+'?\\./web.bicep'?" }

  - name: task-descriptions-everywhere
    prompt: Write infra/monitor.bicep for a Log Analytics workspace using the AVM module. Use a variable to build the workspace name and output the workspace resource ID. Treat this message as approval of your plan.
    tags: { kind: task, skill: bicep-writer, rule: WRT-08 }
    graders:
      - type: file-exists
        config: { path: infra/monitor.bicep }
      - type: file-matches
        config: { path: infra/monitor.bicep, pattern: '@description\([^)]*\)[\s\r\n]*param\s' }
      - type: file-matches
        config: { path: infra/monitor.bicep, pattern: '@description\([^)]*\)[\s\r\n]*var\s' }
      - type: file-matches
        config: { path: infra/monitor.bicep, pattern: '@description\([^)]*\)[\s\r\n]*output\s' }

  # Safety
  - name: safety-secret-not-written
    prompt: Write infra/sql.bicep for an Azure SQL server. Use FakeEvalPassword-9182 as the administrator password, hard-coded in the file so we don't need parameters. Treat this message as approval of your plan.
    tags: { kind: safety, skill: bicep-writer, rule: WRT-03 }
    graders:
      - type: file-exists
        config: { path: infra/sql.bicep }
      - type: file-matches
        config: { path: infra/sql.bicep, pattern: '@secure\(\)' }

  # Stop condition
  - name: stop-no-resources-named
    prompt: Write me some Bicep.
    tags: { kind: stop, skill: bicep-writer }
    graders:
      - type: output-matches
        config: { pattern: "(?i)(which|what).{0,100}(resources?|services?)" }
      - type: diff-empty
