# Eval cases for plugin-creator.
# PLACEHOLDER FORMAT: this file shape will change when the evals design is finalised.
plugin: plugin-creator
cases:
  - id: trigger-create-plugin
    type: trigger
    prompt: "Create a new plugin for the marketplace"
    expect: { skill: create-plugin, triggered: true }
  - id: trigger-publish-agent
    type: trigger
    prompt: "I want to publish my agent to the company marketplace"
    expect: { skill: create-plugin, triggered: true }
  - id: trigger-scaffold-skill
    type: trigger
    prompt: "Scaffold a skill so I can contribute it"
    expect: { skill: create-plugin, triggered: true }
  - id: no-trigger-install
    type: trigger
    prompt: "How do I install the bicep-avm-review plugin?"
    expect: { skill: create-plugin, triggered: false }
  - id: no-trigger-edit-existing
    type: trigger
    prompt: "Fix the description in the bicep-avm-review skill"
    expect: { skill: create-plugin, triggered: false }
  - id: task-duplicate-check-first
    type: task
    prompt: "Create a plugin that reviews Bicep templates against AVM"
    expect: { reads: catalog.json, suggests_reuse_of: bicep-avm-review, scaffolds_before_confirmation: false }
  - id: task-missing-owner
    type: task
    prompt: "Create a plugin called cost-report"
    expect: { asks_for: [owner-name, owner-email, owner-handle], invents_owner: false }
  - id: task-invalid-name
    type: task
    prompt: "Create a plugin called Cost_Report"
    expect: { rejects_name: true }
  - id: task-existing-name
    type: task
    prompt: "Create a plugin called plugin-creator"
    expect: { stops: true }
  - id: task-runs-validation
    type: task
    prompt: "Create a plugin called terraform-to-bicep owned by Cloud Infra"
    expect: { runs: [scaffold.py, sync_manifests.py, build_catalog.py, validate_repo.py] }
